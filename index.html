<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de tarefa</title>
</head>
<body>
    <header>
        <h1>Gerenciador de tarefa</h1>
    </header>
    <main>
        <section aria-labelledby="titulo-busca">
            <h2 id="titulo-busca">Busca e filtros</h2>
            <form action="#" method="get">
                <div>
                    <label for="busca-tarefa">Buscar tarefa por titulo</label>
                    <input type="search" id="busca-tarefa" name="busca-tarefa">
                </div>
                <fieldset>
                    <legend>Filtrar por status</legend>
                    <div>
                        <input type="radio" id="status-todos" name="status"" value="todos">
                        <label for="status-todos">Todos</label>
                    </div>
                    <div>
                        <input type="radio" id="status-afazer" name="status" value="a-fazer">
                        <label for="status-afazer">A fazer</label>
                    </div>
                    <div>
                        <input type="radio" id="status-andamento" name="status" value="em-andamento">
                        <label for="status-andamento">Em andamento</label>
                    </div>
                    <div>
                        <input type="radio" id="status-revisao" name="status" value="em-revisao">
                        <label for="status-revisao">Em revisão</label>
                    </div>
                    <div>
                        <input type="radio" id="status-concluida" name="status" value="concluida">
                        <label for="status-concluida">Concluida</label>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>

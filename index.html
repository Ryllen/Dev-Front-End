<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="styles.css">

    <title>Gerenciador de tarefa</title>
</head>

<body>

    <!-- Região para mensagens acessíveis da aplicação -->
    <div
        id="status-regiao"
        role="status"
        aria-live="polite"
    ></div>


    <header>

        <h1>Gerenciador de tarefa</h1>

    </header>


    <main>

        <!-- Busca e filtros -->
        <section aria-labelledby="titulo-busca">

            <h2 id="titulo-busca">
                Busca e filtros
            </h2>


            <form
                id="form-filtros"
                action="#"
                method="get"
            >

                <div>

                    <label for="busca-tarefa">
                        Buscar tarefa por titulo
                    </label>

                    <input
                        type="search"
                        id="busca-tarefa"
                        name="busca-tarefa"
                    >

                </div>


                <fieldset>

                    <legend>
                        Filtrar por status
                    </legend>


                    <div>

                        <input
                            type="radio"
                            id="status-todos"
                            name="status"
                            value="todos"
                            checked
                        >

                        <label for="status-todos">
                            Todos
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="status-afazer"
                            name="status"
                            value="a-fazer"
                        >

                        <label for="status-afazer">
                            A fazer
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="status-andamento"
                            name="status"
                            value="em-andamento"
                        >

                        <label for="status-andamento">
                            Em andamento
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="status-revisao"
                            name="status"
                            value="em-revisao"
                        >

                        <label for="status-revisao">
                            Em revisão
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="status-concluida"
                            name="status"
                            value="concluida"
                        >

                        <label for="status-concluida">
                            Concluída
                        </label>

                    </div>

                </fieldset>


                <fieldset>

                    <legend>
                        Filtrar por prioridade
                    </legend>


                    <div>

                        <input
                            type="radio"
                            id="prioridade-todas"
                            name="prioridade"
                            value="todas"
                            checked
                        >

                        <label for="prioridade-todas">
                            Todas
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="prioridade-baixa"
                            name="prioridade"
                            value="Baixa"
                        >

                        <label for="prioridade-baixa">
                            Baixa
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="prioridade-media"
                            name="prioridade"
                            value="Média"
                        >

                        <label for="prioridade-media">
                            Média
                        </label>

                    </div>


                    <div>

                        <input
                            type="radio"
                            id="prioridade-alta"
                            name="prioridade"
                            value="Alta"
                        >

                        <label for="prioridade-alta">
                            Alta
                        </label>

                    </div>

                </fieldset>


                <!-- Ordenação por prazo -->
                <div>

                    <label for="ordenacao">
                        Ordenar por prazo
                    </label>

                    <select
                        id="ordenacao"
                        name="ordenacao"
                    >

                        <option value="nenhuma">
                            Nenhuma
                        </option>

                        <option value="prazo-crescente">
                            Prazo: mais próximo
                        </option>

                        <option value="prazo-decrescente">
                            Prazo: mais distante
                        </option>

                    </select>

                </div>


                <div class="acoes-filtros">

                    <button type="submit">
                        Aplicar filtros
                    </button>

                    <button
                        type="button"
                        id="limpar-filtros"
                    >
                        Limpar filtros
                    </button>

                </div>

            </form>

        </section>


        <!-- A fazer -->
        <section aria-labelledby="status-afazer">

            <h2 id="status-afazer">
                A fazer
            </h2>

            <ul id="lista-afazer">
            </ul>

        </section>


        <!-- Em andamento -->
        <section aria-labelledby="status-andamento">

            <h2 id="status-andamento">
                Em andamento
            </h2>

            <ul id="lista-andamento">
            </ul>

        </section>


        <!-- Em revisão -->
        <section aria-labelledby="status-em-revisao">

            <h2 id="status-em-revisao">
                Em revisão
            </h2>

            <ul id="lista-revisao">
            </ul>

        </section>


        <!-- Concluída -->
        <section aria-labelledby="status-concluida">

            <h2 id="status-concluida">
                Concluída
            </h2>

            <ul id="lista-concluida">
            </ul>

        </section>

    </main>


    <footer>

        <p>
            Ryllen Alves Da Silva Nascimento
        </p>

        <p>
            Disciplina:
            Desenvolvimento Front-End - 2026.2
        </p>

    </footer>


    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
